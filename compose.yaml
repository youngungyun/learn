# 로컬 개발용 인프라. 단계가 올라갈수록 서비스가 추가된다.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: meetlab
      POSTGRES_USER: meetlab
      POSTGRES_PASSWORD: meetlab
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 부터 데이터 디렉터리가 /var/lib/postgresql/<버전>/ 아래로 바뀌어 상위 경로를 마운트한다.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetlab -d meetlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  coturn:
    image: coturn/coturn:4.18.0
    # 로컬에서는 relay 포트 범위가 넓으면 Docker 가 느려지므로 좁게 잡는다.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --realm=meetlab.local
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-only-turn-secret-change-me}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:13.2.5
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
